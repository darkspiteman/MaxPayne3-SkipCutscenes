; MP3SkipCutscenes 0.2 - settings. The file is optional: without it the defaults below are used.
; Edit while the game is closed.

[Main]
; 1 = mod on, 0 = mod loads but changes nothing in the game.
Enabled=1

; Skip key as a Windows virtual-key code (decimal). 32 = Space, 13 = Enter, 27 = Esc.
; 0 = no extra key (only the game's own skip button works).
SkipKey=32

; 1 = allow skipping cutscenes that the game's scripts lock ("STILL LOADING" / no skip prompt).
; On a skip the mod first loads everything the game is waiting for. Most locked cutscenes are then
; unlocked by the scripts themselves and end at once with the game's own skip.
UnlockCutscenes=1

; What to do with a cutscene that stays locked even after loading:
;   1 = jump to LockedTailFrames before its end and let it finish (scripts keep their timed steps) - safe
;   2 = end it with the game's own skip anyway, like the old ScriptHook skipper - a bit faster, may break scenes
LockedMode=1

; For LockedMode=1: how many cutscene frames (30 = 1 second) still play after the jump (20..450).
; Raise it (60-90) if some scene misbehaves after a skip.
LockedTailFrames=30

; How many frames to wait after loading for the scripts to unlock the skip (1..120).
AllowWaitFrames=4

; A cutscene or transition movie that starts within this many milliseconds after a skipped one ended is
; skipped automatically, so one key press takes you to gameplay. 0 = every cutscene needs its own key press.
ChainWindowMs=2000

; 1 = the skip key also ends kill cameras (bullet cameras).
SkipKillCams=1

; 1 = kill cameras staged by the game's scripts (a scripted shot that must land, e.g. the hostage rescue at the
; start of chapter 1) are NOT ended - ending them cancels the kill. 0 = end every kill camera.
ProtectScriptedKillCams=1

; A staged kill camera can still be ended after it has run this many milliseconds (the shot has landed by then).
; 0 = staged kill cameras can never be ended. Raise it if a kill doesn't count after an early skip.
ScriptedKillCamDelayMs=1500

; 1 = transition ("loading") movies may be skipped as soon as the game has nothing left to load.
UnlockTransitionMovies=1

; How many game frames in a row must have no streaming requests before a movie may be skipped (1..600).
MovieStableFrames=5

; Experimental, keep 0. 1 = lift the game's "frame > 240" condition of its own movie skip once nothing is left to load.
; In the game this only pauses the video (it stutters) and the transition still takes its usual time.
MovieIgnoreMinFrames=0

; Diagnostics: 1 = log what the game's scripts do with the movie natives around a transition movie (for the author).
LogMovieNatives=1

; 1 = the skip key also works in the game's other skip checks while a transition movie plays.
SkipKeyInOtherChecks=1

; Diagnostics: 1 = write the frame rate, worst frame time and window size to the log every 5 seconds.
LogFps=0

; Diagnostics: 1 = write the movie player's code as hex to the log at startup (for the mod's author).
DumpMovieCode=0

; 0 = no log, 1 = normal, 2 = verbose. The log is MP3SkipCutscenes.log next to the .asi file.
LogLevel=1
